<img src="/form.php" style="position: absolute; opacity: 0; pointer-events: none;" />
<form id="contactform" class="form" method="POST" action="{{ .action }}" novalidate>
    {{- range .fields -}}
        {{- if eq .input_type `textarea` -}}
            <div>
                <label class="inborder{{ if eq $.placeholders true }} sr-only{{ end }}" for="{{ .name }}">{{ .placeholder }}</label>
                <textarea name="{{ .name }}" name="{{ .name }}" id="{{ .name }}" cols="30" rows="10" class="form-control" {{ if eq $.placeholders true }}placeholder="{{ .placeholder }}"{{ end }} required></textarea>
            </div>
        {{- else if eq .input_type `radio` -}}
            <div class="radio">
                <label><input type="radio" name="{{ .name }}" value="{{ .placeholder }}" required>{{ .placeholder }}</label>
            </div>
        {{- else if eq .input_type `checkbox` -}}
            <div class="checkbox">
                <label><input type="checkbox" name="{{ .name }}" value="{{ .placeholder }}" required>{{ .placeholder | safeHTML }}</label>
            </div>
        {{- else if eq .input_type `html` -}}
            {{ .placeholder | safeHTML }}
        {{- else if eq .input_type `submit` -}}
            <div class="submit">
                <div><input type="{{ .input_type }}" value="{{ .placeholder }}" class="button" /></div>
            </div>
        {{- else -}}
            <div>
                <label class="inborder{{ if eq $.placeholders true }} sr-only{{ end }}" for="{{ .name }}">{{ .placeholder }}</label>
                <input type="{{ .input_type }}" name="{{ .name }}" id="{{ .name }}" class="form-control" {{ if eq $.placeholders true }}placeholder="{{ .placeholder }}"{{ end }} required>
            </div>
        {{- end -}}
    {{- end -}}
</form>
<script>
(function() {
    const form = document.getElementById('contactform');
    if (!form) return;
    form.addEventListener('submit', function(e) {
        let valid = true;
        const fields = form.querySelectorAll('input[required], textarea[required]');
        fields.forEach(function(field) {
            const parent = field.closest('div');
            let error = parent.querySelector('.form-error');
            if (!field.value.trim()) {
                valid = false;
                if (!error) {
                    error = document.createElement('div');
                    error.className = 'form-error';
                    error.style.cssText = 'color: #c0392b; font-size: 0.85rem; margin-top: 0.25rem;';
                    parent.appendChild(error);
                }
                error.textContent = 'This field is required';
            } else if (field.type === 'email' && field.value) {
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(field.value)) {
                    valid = false;
                    if (!error) {
                        error = document.createElement('div');
                        error.className = 'form-error';
                        error.style.cssText = 'color: #c0392b; font-size: 0.85rem; margin-top: 0.25rem;';
                        parent.appendChild(error);
                    }
                    error.textContent = 'Please enter a valid email address';
                } else if (error) {
                    error.remove();
                }
            } else if (error) {
                error.remove();
            }
        });
        if (!valid) {
            e.preventDefault();
        }
    });
    form.querySelectorAll('input, textarea').forEach(function(field) {
        field.addEventListener('input', function() {
            const parent = field.closest('div');
            const error = parent.querySelector('.form-error');
            if (error && field.value.trim()) {
                if (field.type === 'email') {
                    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (emailPattern.test(field.value)) error.remove();
                } else {
                    error.remove();
                }
            }
        });
    });
})();
</script>
