
{{- $inner := . -}}
{{- if or (eq $inner "") (eq $inner nil) -}}
    {{- $inner = "Empty brick found. Consider creating a 'content/bricks/intro.md' file." -}}
    {{- with site.GetPage "bricks/intro.md" -}}
        {{- $inner = .RawContent -}}
    {{- end -}}
{{- end -}}
<section class="intro">
    <div class="container small">
        {{- markdownify $inner -}}
    </div>
</section>
